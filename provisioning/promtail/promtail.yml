server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: systemd-journal
    journal:
      path: /var/log/journal
      max_age: 12h
      labels:
        job: systemd-journal
        host: debian
    relabel_configs:
      - source_labels: ['__journal__systemd_unit']
        regex: 'mycvplanner-platform\.service|mycvplanner-api\.service|mycvplanner-keila-unsubscribe-forwarder\.service'
        action: keep
      - source_labels: ['__journal__systemd_unit']
        target_label: unit
      - source_labels: ['__journal__hostname']
        target_label: host
      - source_labels: ['__journal_priority_keyword']
        target_label: level
      - source_labels: ['__journal__systemd_unit']
        regex: 'mycvplanner-platform\.service'
        target_label: service
        replacement: platform
      - source_labels: ['__journal__systemd_unit']
        regex: 'mycvplanner-api\.service'
        target_label: service
        replacement: api
      - source_labels: ['__journal__systemd_unit']
        regex: 'mycvplanner-keila-unsubscribe-forwarder\.service'
        target_label: service
        replacement: newsletter-forwarder

  - job_name: docker-newsletter
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values:
              - com.docker.compose.project=mycvplanner-newsletter
    pipeline_stages:
      - docker: {}
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'keila|postgres'
        action: keep
      - source_labels: ['__meta_docker_container_id']
        target_label: __path__
        replacement: /var/lib/docker/containers/$1/$1-json.log
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'keila'
        target_label: service
        replacement: newsletter
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        regex: 'postgres'
        target_label: service
        replacement: newsletter-postgres
      - target_label: job
        replacement: docker-newsletter
      - target_label: host
        replacement: debian